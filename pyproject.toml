[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[project]
name = "sombra-engine"
version = "0.2.0"
authors = [
  { name="Jesus Henriquez" },
]
description = "Small 3D game engine used at Sombra Studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.4",
    "psutil==7.2.2",
    "pudu-ui==0.2.1",
    "pyglet>=3.0.dev3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Rendering"
]
license = "MIT"

[project.urls]
Homepage = "https://github.com/sombra-studio/sombra-engine"
Issues = "https://github.com/sombra-studio/sombra-engine/issues"

[tool.uv.build-backend]
module-name = "sombra_engine"
module-root = ""

[tool.uv.sources]
pyglet = { path = "../pyglet", editable = true }
pudu-ui = { path = "../pudu-ui", editable = true }
#source-include = ["sombra_engine/shaders/**"]
#source-exclude = ["tests/**", ]


